name: Chocolatey Build and Push
on:
  workflow_call:
    inputs:
      package_name:
        description: "Name of the package to process"
        type: string
        required: true
        default: "trivy"
      package_source_main:
        description: "Main package source URL"
        type: string
        required: true
        default: "https://push.chocolatey.org/"
      package_source_test:
        description: "Test package source URL"
        type: string
        required: true
        default: "https://www.myget.org/F/public-choco-dev/api/v2/package"
      run_tests:
        description: "Run tests"
        type: boolean
        required: false
        default: true
    secrets:
      CHOCO_API_KEY:
        required: true
      MYGET_API_KEY:
        required: true

permissions:
  actions: read
  attestations: read
  contents: write
  deployments: read
  discussions: read
  issues: read
  packages: write
  pages: read
  pull-requests: write
  repository-projects: read
  security-events: read
  statuses: write
  checks: write
  id-token: write

env:
  PACKAGE_NAME: ${{ inputs.package_name }}
  PACKAGE_SOURCE_MAIN: ${{ inputs.package_source_main }}
  PACKAGE_SOURCE_TEST: ${{ inputs.package_source_test }}
  RUN_TESTS: ${{ inputs.run_tests }}

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.2.1
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false

  build:
    needs: [super-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
      fail-fast: false # Continue with other OS if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Choco pack
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: pack

      - name: Choco install ${{ env.PACKAGE_NAME }}
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install ${{ env.PACKAGE_NAME }} -y -s .

      - name: Run version check
        if: ${{ env.RUN_TESTS == 'true' }}
        shell: powershell
        run: |
          ${{ env.PACKAGE_NAME }} version

      # Branch-Specific Steps with environment variables
      - name: Push to Chocolatey on main or master
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && matrix.os == 'windows-2022'
        uses: Wandalen/wretry.action@v3
        with:
          action: crazy-max/ghaction-chocolatey@v3
          with: |
            args: push --source ${{ env.PACKAGE_SOURCE_MAIN }} -k=${{ secrets.CHOCO_API_KEY }}
          attempt_limit: 3
          attempt_delay: 30000

      - name: Push to MyGet on test branch
        if: success() && github.ref == 'refs/heads/test'
        uses: Wandalen/wretry.action@v3
        with:
          action: crazy-max/ghaction-chocolatey@v3
          with: |
            args: push --source ${{ env.PACKAGE_SOURCE_TEST }} -k=${{ secrets.MYGET_API_KEY }}
          attempt_limit: 3
          attempt_delay: 30000
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
